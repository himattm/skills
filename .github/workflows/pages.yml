name: Build & deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [gh-pages-src-updated]

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (plugin content + full git history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build-posts.rb needs history for per-skill first-commit dates

      - name: Checkout gh-pages-src (Jekyll source)
        uses: actions/checkout@v4
        with:
          ref: gh-pages-src
          path: .site-src

      - name: Overlay Jekyll source onto main checkout
        run: |
          shopt -s dotglob
          # Copy site source into the main worktree, skipping .site-src's own .git
          rsync -a --exclude='.git' .site-src/ ./
          rm -rf .site-src

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Generate _posts/ from plugin skill sources
        run: ruby bin/build-posts.rb

      - name: Jekyll build
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
