title: himattm skills
description: Matt Mckenna's Claude Code plugin marketplace — Android development and PR review skills.
url: https://himattm.github.io
baseurl: /skills
remote_theme: just-the-docs/just-the-docs

plugins:
  - jekyll-titles-from-headings

include:
  - plugins

exclude:
  - "plugins/*/skills/**/*.tmpl"
  - "plugins/*/skills/**/*.kts"
  - "plugins/*/skills/**/build-logic"
  - "plugins/*/skills/**/google-services.json.example"
  - "plugins/*/skills/**/ci.yml"
  - "plugins/*/skills/**/detekt.yml"
  - "plugins/*/skills/**/editorconfig"
  - "plugins/*/skills/**/gitignore"
  - "plugins/*/skills/**/libs.versions.toml"
  - README.md
  - Gemfile
  - Gemfile.lock
  - .codex/
  - .claude/
  - docs/

# Just-the-Docs theme settings
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
heading_anchors: true
color_scheme: dark

# jekyll-titles-from-headings settings — pull page title from first # H1
titles_from_headings:
  enabled: true
  strip_title: false
  collections: true

# Inject layout + parent into each plugin's skills, so SKILL.md files don't
# need any Jekyll-specific frontmatter.
defaults:
  - scope:
      path: "plugins/android/skills/*/SKILL.md"
    values:
      layout: default
      parent: android
  - scope:
      path: "plugins/review/skills/*/SKILL.md"
    values:
      layout: default
      parent: review
  - scope:
      path: "plugins/*/index.md"
    values:
      layout: default

# Footer and links
aux_links:
  "GitHub":
    - "https://github.com/himattm/skills"
back_to_top: true
back_to_top_text: "Back to top"
