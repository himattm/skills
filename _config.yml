theme: jekyll-theme-chirpy

lang: en
timezone: America/Los_Angeles

title: Matt's Skills
tagline: Claude Code plugin marketplace
description: Matt Mckenna's personal skill bundles for Android/Compose development and pull request review workflows.

url: "https://himattm.github.io"
baseurl: "/skills"

github:
  username: himattm

# Sidebar profile
avatar: "https://github.com/himattm.png"

social:
  name: Matt Mckenna
  links:
    - https://github.com/himattm
    - https://bsky.app/profile/mmckenna.me
    - https://androiddev.social/@mattm
    - https://www.threads.net/@himattm
    - https://www.linkedin.com/in/himattm

# Theme + UX
# theme_mode: leave empty so Chirpy respects the user's system preference
# (prefers-color-scheme). Set to `light` or `dark` to force one mode.
theme_mode:
toc: true                # show TOC on post pages
paginate: 10

# Make _tabs/ a Jekyll collection so Chirpy renders the sidebar nav.
# (Theme defines this in its own _config; we re-declare since site config
# overrides theme config wholesale, not by merge.)
collections:
  tabs:
    output: true
    sort_by: order

# Skills are rendered as Chirpy posts; the transform script in bin/build-posts.rb
# generates _posts/ from plugins/<plugin>/skills/<skill>/SKILL.md before each build.
# Per-post `permalink:` is set by the script so URLs mirror the source structure.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      hidden: false
  - scope:
      path: _tabs
      type: tabs
    values:
      layout: page
      permalink: /:title/

plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-include-cache

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

exclude:
  - Gemfile
  - Gemfile.lock
  - bin/
  - README.md
  - .codex/
  - .claude/
  - docs/
  - .claude-plugin/
  - "plugins/*/.claude-plugin/"
  - "plugins/*/skills/**/*.tmpl"
  - "plugins/*/skills/**/*.kts"
  - "plugins/*/skills/**/build-logic"
  - "plugins/*/skills/**/google-services.json.example"
  - "plugins/*/skills/**/ci.yml"
  - "plugins/*/skills/**/detekt.yml"
  - "plugins/*/skills/**/editorconfig"
  - "plugins/*/skills/**/gitignore"
  - "plugins/*/skills/**/libs.versions.toml"
  # Don't process the source SKILL.md files directly — only the transformed _posts.
  - "plugins/*/skills/*/SKILL.md"
  - "plugins/*/skills/*/references/"
