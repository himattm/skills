build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  TooManyFunctions:
    active: false

style:
  MagicNumber:
    ignoreNumbers: ['-1', '0', '1', '2', '100']
  WildcardImport:
    active: true
  MaxLineLength:
    maxLineLength: 120

naming:
  FunctionNaming:
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
